version: '3.3'
services:
  mongo:
    ports:
      - '27017:27017'
    container_name: demo-mongo
    restart: on-failure
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongoadmin
      - MONGO_INITDB_ROOT_PASSWORD=password
    image: mongo
    networks: [insanetwork]
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "127.0.0.1/admin",
          "--eval",
          "'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  app-spring-1:
    build: ../
    container_name: app-spring-1
    ports:
      - "8080:8080"
    networks: [insanetwork]
    links:
      - mongo
    depends_on:
      mongo:
        condition: service_healthy

networks:
  insanetwork:
    driver: bridge
